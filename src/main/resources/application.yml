spring:
  application:
    name: job-tracker
    
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobtracker}
    username: ${DB_USER:jobtracker}
    password: ${DB_PASSWORD:jobtracker}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    
app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: job-tracker
      access-token-ttl: 15m
    admin:
      email: ${APP_ADMIN_EMAIL:}
      password: ${APP_ADMIN_PASSWORD:admin123}
      
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:job-tracker}
    region: ${S3_REGION:us-east-1}
    
  ai:
    base-url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-3.5-flash-lite}
    api-key: ${GEMINI_API_KEY:}